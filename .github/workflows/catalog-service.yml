name: Catalog Service

on:
  push:
    paths:
      - 'Catalog-Service/**'
      - '.github/workflows/catalog-service.yml'
    branches:
      - '**'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      working-directory: ./Catalog-Service
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/bookstore-catalog-service

    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw -ntp verify

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          ./mvnw spring-boot:build-image \
          -Dspring-boot.build-image.imageName=$DOCKER_IMAGE_NAME:latest \
          -DskipTests

      - name: Push Docker Image
        run: |
          echo "Pushing the image $DOCKER_IMAGE_NAME:latest to Docker Hub..."
          docker push $DOCKER_IMAGE_NAME:latest